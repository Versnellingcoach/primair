name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm ls astro @astrojs/sitemap
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
