name: Lockfile bijwerken

# Handmatig te starten (Actions → Lockfile bijwerken → Run workflow).
# Maakt package-lock.json aan of werkt hem bij na een wijziging in package.json,
# en zet het resultaat op de branch `lockfile-bijwerken`. Open daarna een pull request.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet --exit-code -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile is al actueel."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lockfile bijwerken"
          git push --force origin HEAD:lockfile-bijwerken
