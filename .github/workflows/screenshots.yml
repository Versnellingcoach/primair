name: Screenshots

# Maakt schermafbeeldingen van de gebouwde site (desktop en mobiel) voor visuele review.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          SHOW_UNCONFIRMED: "true"
      - name: Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Schermafbeeldingen
        run: |
          (cd dist && python3 -m http.server 4321 >/dev/null 2>&1 &)
          sleep 1
          node scripts/screenshots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 7
